plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def appVersionName = project.hasProperty('APP_VERSION_NAME') ? project.property('APP_VERSION_NAME') : "1.0.0"

// major * 1_000_000 + minor * 10_000 + patch * 100 + (debug ? 1 : 0)
// e.g. 1.17.6 → 1_170_600 (release), 1.17.6-debug.xxx → 1_170_601
def computeVersionCode = { String name ->
    def m = (name =~ /(\d+)\.(\d+)\.(\d+)/)
    if (m.find()) {
        def base = m.group(1).toInteger() * 1000000 + m.group(2).toInteger() * 10000 + m.group(3).toInteger() * 100
        return base + (name.contains("-debug") ? 1 : 0)
    }
    return 1
}

def appVersionCode = project.hasProperty('APP_VERSION_CODE') ? project.property('APP_VERSION_CODE').toString().toInteger() : computeVersionCode(appVersionName)

android {
    namespace 'com.wand.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.wand.app"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        // sherpa-onnx 原生库只随包带 arm64：现代真机全是 arm64-v8a，
        // 砍掉其余 ABI 省约 3/4 的 .so 体积（代价：x86 模拟器装不了）。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Stable signing config — committed to the repo so APKs built locally,
    // by publish.sh, and by GitHub Actions all share the same signature.
    // Without this, every machine generates its own debug keystore and users
    // hit "package signatures do not match" when updating across sources.
    // This is a self-signed distribution key, NOT a Play Store upload key.
    signingConfigs {
        wand {
            storeFile rootProject.file('wand-release.keystore')
            storePassword 'wand-release'
            keyAlias 'wand'
            keyPassword 'wand-release'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.wand
        }
        release {
            signingConfig signingConfigs.wand
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        jniLibs {
            // .so 压缩进 APK：下载体积从 +22MB 降到 +8MB（自分发下载体积优先；
            // 代价是安装时解压、磁盘双份占用）。
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.18.0'
    // QR scanner — wraps ZXing for camera-based decoding
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Native client UI (Compose) — mirrors the iOS SwiftUI client
    def composeBom = platform('androidx.compose:compose-bom:2025.05.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    // 全量 Material Icons（BOM 2025.05 不再带该工件，必须显式版本号）
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // REST + WebSocket client for the native session protocol
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 端侧语音识别（sherpa-onnx，static-link onnxruntime 版 AAR）。
    // 提交在 libs/ 而不走仓库依赖：JitPack 对 k2-fsa 最新 tag 构建失败、
    // 国内可达性不可控；钉本地文件保证三种构建（本地/publish.sh/CI）确定一致。
    // 来源：https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-static-link-onnxruntime-1.13.2.aar
    implementation files('libs/sherpa-onnx-static-link-onnxruntime-1.13.2.aar')
}
