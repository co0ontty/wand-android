plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile

// 只带固定官方版本的 JVM API；原生引擎在用户启用语音后按需下载。
// tools/prepare-sherpa-api.py 可从官方 AAR 字节级复现，普通构建不下载/提取 AAR。
def sherpaApiJar = file('libs/sherpa-onnx-api-1.13.2.jar')
def sherpaApiManifest = file('libs/sherpa-onnx-api-1.13.2.json')
def verifySherpaApi = tasks.register('verifySherpaApi') {
    inputs.files(sherpaApiJar, sherpaApiManifest)
    doLast {
        def spec = new JsonSlurper().parse(sherpaApiManifest)
        def hash = MessageDigest.getInstance('SHA-256').digest(sherpaApiJar.bytes).encodeHex().toString()
        if (hash != spec.apiSha256) throw new GradleException('sherpa JVM API SHA-256 不匹配')
        new ZipFile(sherpaApiJar).withCloseable { jar ->
            if (spec.removedClasses.any { jar.getEntry(it) != null } ||
                jar.entries().toList().any { it.name.endsWith('.so') }) {
                throw new GradleException('sherpa JVM API 不得含 eager-load wrapper 或原生库')
            }
        }
    }
}

def appVersionName = project.hasProperty('APP_VERSION_NAME') ? project.property('APP_VERSION_NAME') : "1.0.0"

// versionCode 的唯一真源 —— 由 versionName 派生，所有构建方式（本地 / publish.sh / CI）必须
// 走同一公式。历史教训：CI 曾自带一套 major*10000 的小数字方案，与本公式并存后，本地构建装过
// 一次（大 versionCode）的设备升级任何 CI 包都会被系统当成「降级」拒装。
//
// major * 10_000_000 + minor * 10_000 + patch * 100 + (debug ? 1 : 0)
// e.g. 1.55.1 → 10_550_100 (release), 1.55.1-debug.xxx → 10_550_101
//
// 排序语义（与服务端/网页设置页的安装序比较器保持一致）：
// - debug 包是「tag X 之后的 master 构建」，比 release X 新 → 同三段时 debug = base+1 > release。
// - 下一个 release（patch+1）= base+100，仍高于任何同段 debug。
// 段位上限：minor ≤ 999、patch ≤ 99（超限直接 fail，防止 versionCode 回绕变小）。
def computeVersionCode = { String name ->
    def m = (name =~ /(\d+)\.(\d+)\.(\d+)/)
    if (!m.find()) {
        throw new GradleException("APP_VERSION_NAME '" + name + "' 不含 X.Y.Z 版本号，无法派生 versionCode")
    }
    def major = m.group(1).toInteger()
    def minor = m.group(2).toInteger()
    def patch = m.group(3).toInteger()
    if (minor > 999 || patch > 99 || major > 209) {
        throw new GradleException("版本号 " + name + " 超出 versionCode 段位上限（major ≤ 209, minor ≤ 999, patch ≤ 99），请提升上一级段位")
    }
    return major * 10000000 + minor * 10000 + patch * 100 + (name.contains("-debug") ? 1 : 0)
}

// 刻意不再支持 -PAPP_VERSION_CODE 覆盖：外部传入是两套方案并存事故的根源。
def appVersionCode = computeVersionCode(appVersionName)

android {
    namespace 'com.wand.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.wand.app"
        // 只兼容最近 ~3 年的设备（Android 13 / 2022 起）。抬到 33 后 RuntimeShader 无条件可用，
        // 液态玻璃在所有支持设备上原生跑，Glass.kt 的低版本降级分支恒不触发（保留为死分支，无害）。
        minSdk 33
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 端侧语音仅支持 arm64：现代真机全是 arm64-v8a，
        // 砍掉其余 ABI 省约 3/4 的 .so 体积（代价：x86 模拟器装不了）。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Stable signing config — committed to the repo so APKs built locally,
    // by publish.sh, and by GitHub Actions all share the same signature.
    // Without this, every machine generates its own debug keystore and users
    // hit "package signatures do not match" when updating across sources.
    // This is a self-signed distribution key, NOT a Play Store upload key.
    signingConfigs {
        wand {
            storeFile rootProject.file('wand-release.keystore')
            storePassword 'wand-release'
            keyAlias 'wand'
            keyPassword 'wand-release'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.wand
            // 分发的就是 debug 变体（CI / publish.sh 都跑 assembleDebug）。未裁剪时
            // material-icons-extended 的 ~5000 图标 + 全量 Compose 全进 dex，APK 膨到 ~75MB。
            // 仅在「带版本号的分发构建」（CI / publish.sh 传 -PAPP_VERSION_NAME）启用 R8 + 资源裁剪，
            // 把分发包压到 ~15MB；裸 `./gradlew assembleDebug` 仍不裁剪，保证本地迭代快。
            // 复用 release 的 proguard 规则（sherpa-onnx JNI 必须 keep，见 proguard-rules.pro）。
            def distributionBuild = project.hasProperty('APP_VERSION_NAME')
            minifyEnabled distributionBuild
            shrinkResources distributionBuild
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.wand
            // R8 代码压缩 + 资源裁剪：缩小 APK、加快启动。keep 规则见 proguard-rules.pro
            // （sherpa-onnx JNI 必须保留，否则 native 方法绑定失效崩溃）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        dex {
            // minSdk 33 默认把 classes*.dex 原样存进 APK（约 16 MiB）。自分发 APK
            // 优先降低下载体积：压缩后约 7.2 MiB；安装时由系统解压，可能多占磁盘。
            useLegacyPackaging = true
        }
        jniLibs {
            // .so 压缩进 APK：下载体积从 +22MB 降到 +8MB（自分发下载体积优先；
            // 代价是安装时解压、磁盘双份占用）。
            useLegacyPackaging = true
        }
    }
}

configurations {
    termlibPatchAsm
    termlibOriginal {
        transitive = false
    }
}

def patchedTermlib = layout.buildDirectory.file('generated/termlib/termlib-0.0.10-gesture.aar')

tasks.register('compileTermlibPatcher', JavaCompile) {
    source = fileTree(dir: "${rootDir}/tools", include: 'TermlibGesturePatch.java')
    classpath = configurations.termlibPatchAsm
    destinationDirectory.set(layout.buildDirectory.dir('termlib-patcher'))
    sourceCompatibility = JavaVersion.VERSION_17.toString()
    targetCompatibility = JavaVersion.VERSION_17.toString()
}

// termlib 0.0.10 把滚动阈值用在每一帧的位移上，慢滑会误触发文字选择。
// 构建时改写这一处比较，改成相对按下点的累计距离。
tasks.register('patchTermlibGesture', JavaExec) {
    dependsOn('compileTermlibPatcher')
    classpath = files(layout.buildDirectory.dir('termlib-patcher')) + configurations.termlibPatchAsm
    mainClass.set('com.wand.tools.TermlibGesturePatch')
    inputs.files(configurations.termlibOriginal)
    inputs.file(rootProject.file('tools/TermlibGesturePatch.java'))
    outputs.file(patchedTermlib)
    argumentProviders.add({
        [
            configurations.termlibOriginal.singleFile.absolutePath,
            patchedTermlib.get().asFile.absolutePath,
        ]
    } as org.gradle.process.CommandLineArgumentProvider)
}

dependencies {
    termlibPatchAsm 'org.ow2.asm:asm:9.7.1'
    termlibPatchAsm 'org.ow2.asm:asm-tree:9.7.1'
    termlibOriginal('org.connectbot:termlib:0.0.10') { transitive = false }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.18.0'
    // QR scanner — wraps ZXing for camera-based decoding
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Native client UI (Compose) — mirrors the iOS SwiftUI client
    def composeBom = platform('androidx.compose:compose-bom:2025.12.01')
    implementation composeBom
    // 液态玻璃引擎（Kyant0/AndroidLiquidGlass）：drawBackdrop + vibrancy/blur/lens 折射。
    // 需要 API 33+ RuntimeShader，低版本由 ui/theme/Glass.kt 降级为半透明+边缘高光。
    // 注意：该库用 Kotlin 2.3 / Compose 1.10 编译 → 本工程 Kotlin ≥ 2.2、BOM ≥ 2025.12。
    // 钉 1.0.6（Android-only 末版）：2.0.0 的 AAR 要求 compileSdk 37，AGP 8.10 最高支持 36。
    implementation 'io.github.kyant0:backdrop:1.0.6'
    // Compose terminal renderer backed by libvterm. The AAR is termlib 0.0.10 with
    // the scroll/selection gesture patch applied by patchTermlibGesture.
    implementation files(tasks.named('patchTermlibGesture'))
    implementation 'androidx.compose.material3:material3'
    // 全量 Material Icons（BOM 2025.05 不再带该工件，必须显式版本号）
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // REST + WebSocket client for the native session protocol
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Compose 图片加载（聊天内联缩略图 / 全屏预览）：用 WandHttp.client 走自签证书 + cookie 鉴权。
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // 固定来源的 API jar 不含 eager-load wrapper 或 22 MB 原生库。
    // 启用语音时从同版本官方发行包下载并校验（见 SpeechNativeLibrary）。
    implementation files(sherpaApiJar)
}

// UI 页面只能跨 Wand 设计系统 seam 使用 Material 3。底层 Material/玻璃实现集中在
// ui/components 与 ui/theme，防止后续页面再次复制弹窗、输入框、底部弹层和卡片样式。
tasks.register('verifyWandDesignSystem') {
    def uiRoot = file('src/main/java/com/wand/app/ui')
    def connectActivity = file('src/main/java/com/wand/app/ConnectActivity.java')
    inputs.files(fileTree(uiRoot) { include '**/*.kt' }, connectActivity)
    doLast {
        def forbidden = [
            [pattern: ~/\bAlertDialog\s*\(/, replacement: 'WandDialog'],
            [pattern: ~/\bModalBottomSheet\s*\(/, replacement: 'WandBottomSheet'],
            [pattern: ~/\bOutlinedTextField\s*\(/, replacement: 'WandTextField'],
            [pattern: ~/\.glassCard\s*\(/, replacement: 'WandCard/wandCardSurface'],
        ]
        def violations = []
        fileTree(uiRoot) {
            include 'screens/**/*.kt', 'WandApp.kt'
        }.files.sort().each { source ->
            source.eachLine { line, number ->
                forbidden.each { rule ->
                    if (line =~ rule.pattern) {
                        violations << "${source.name}:${number}: use ${rule.replacement}"
                    }
                }
            }
        }
        if (connectActivity.text.contains('R.layout.activity_connect')) {
            violations << 'ConnectActivity.java: connection UI must stay on WandTheme/Compose'
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Wand design-system violations:\n' + violations.join('\n'))
        }
    }
}

tasks.named('preBuild').configure { dependsOn('verifyWandDesignSystem', verifySherpaApi) }

tasks.withType(Test).configureEach {
    // 可选官方产物集成验证；常规单测使用小型 fixture，不要求完整 AAR。
    def archive = providers.gradleProperty('SHERPA_AAR').orNull
    if (archive != null) systemProperty 'wand.sherpaAar', file(archive).absolutePath
}
