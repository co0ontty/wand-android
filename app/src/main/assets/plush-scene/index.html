<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"><style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent}canvas{width:100vw;height:100vh;display:block}
/* Same eight tapered orbit marks as Web AvatarThinking. Renderer projects the anchor from the actual head. */
#thought{display:none;position:absolute;left:var(--plush-thinking-x,20px);top:var(--plush-thinking-y,14px);transform:translate(-50%,-50%);line-height:0;color:#6c78a8;pointer-events:none}
body[data-thinking="true"] #thought{display:block}#thought svg{animation:thought-orbit 1.4s linear infinite}body[data-reduced="true"] #thought svg{animation:none}
@keyframes thought-orbit{to{transform:rotate(360deg)}}
</style></head><body><canvas></canvas><span id="thought" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="#f1f3f7" stroke-width="0.6"><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="1" transform="rotate(0 12 12)"/><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="0.9" transform="rotate(45 12 12)"/><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="0.75" transform="rotate(90 12 12)"/><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="0.6" transform="rotate(135 12 12)"/><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="0.45" transform="rotate(180 12 12)"/><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="0.3" transform="rotate(225 12 12)"/><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="0.2" transform="rotate(270 12 12)"/><rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="0.15" transform="rotate(315 12 12)"/></svg></span><script src="runtime.js"></script><script>
let handle;
window.setScene=function(options){try{const canvas=document.querySelector('canvas');canvas.style.width=options.size+'px';canvas.style.height=options.size+'px';document.documentElement.style.height=options.size+'px';document.body.style.height=options.size+'px';document.body.dataset.thinking=String(!!options.thinking&&options.fileActivity==='idle');document.body.dataset.reduced=String(!!options.reducedMotion);if(handle)handle.update(options);else handle=window.__wandPlushRuntime.attach(canvas,options,(renderer)=>{document.title=renderer==='webgl'?'scene-ready':'scene-fallback'});}catch(e){document.title='scene-fallback'}};
window.disposeScene=function(){if(handle)handle.dispose();handle=null};
</script></body></html>
